name: Build WA Stress Tester

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir project
          unzip *.zip -d project

      - name: Build APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WAStressTester-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
